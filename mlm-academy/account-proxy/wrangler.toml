name = "mlma-account"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true
account_id = "1097bdc74e5788fb297506389defcfea"

# Секрет MLMA_SESSION_SECRET задаётся через wrangler secret, не в этом файле.

[vars]
PAYMENTS_ENABLED = "false"
COMMERCE_PREVIEW_ENABLED = "false"
TEST_MODE = "true"
REGISTERED_BETA_ACCESS_ENABLED = "true"
PAID_TRACK_NAVIGATION_ENABLED = "false"
ALLOW_DRAFT_RULES = "false"
ENTITLEMENT_BYPASS = "false"
SIGNUP_ENABLED = "false"
BETA_COHORT_CUTOFF_ISO = "2026-09-02T00:00:00.000Z"

# Публичные Tilda assets v1. /api/* остаётся на Worker.
# ASSET_BASE=https://mlma-account.mlmacademy-search.workers.dev
[assets]
directory = "../tilda/dist/shared"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = ["/api/*", "/health"]

[[kv_namespaces]]
binding = "MLMA_ACCOUNT"
id = "0b46cfe22b7d4f2ab1adb0af4f68d4a8"
