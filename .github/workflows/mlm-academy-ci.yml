name: MLM Academy CI

on:
  push:
    branches: [main]
    paths:
      - 'mlm-academy/**'
      - '.github/workflows/mlm-academy-ci.yml'
  pull_request:
    paths:
      - 'mlm-academy/**'
      - '.github/workflows/mlm-academy-ci.yml'

defaults:
  run:
    working-directory: mlm-academy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mlm-academy/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm tilda:test

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mlm-academy/playwright-report
          retention-days: 7
